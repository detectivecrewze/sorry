name = "sorry-letter-api"
main = "src/index.ts"
compatibility_date = "2026-01-31"

[vars]
MEDIA_BASE_URL = "https://cdn.for-you-always.my.id"
PUBLIC_GIFT_BASE_URL = "https://sorry.for-you-always.my.id"
PUBLIC_STUDIO_BASE_URL = "https://sorry.for-you-always.my.id"
ALLOWED_ORIGINS = "https://sorry.for-you-always.my.id,https://sorry-pi-coral.vercel.app,http://127.0.0.1:5173,http://localhost:5173"

[[kv_namespaces]]
binding = "GIFT_KV"
id = "77fa635e88b9495fbd0b105ad5197180"
preview_id = "d90f66ededa146f7bae82449798da0bb"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "valentine-upload"
preview_bucket_name = "sorry-letter-media-local"

# Configure secrets before deployment:
# wrangler secret put ADMIN_SECRET
# wrangler secret put GENERATOR_SECRET
# wrangler secret put PROJECT_SIGNING_SECRET
